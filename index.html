<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA</title>
  <style>
    /* Design Tokens */
    :root {
      --bg-base: #0c0d11;
      --bg-gradient: radial-gradient(circle at 50% 38%, #161822 0%, #0d0e13 55%, #07080a 100%);
      --surface-glass: rgba(18, 20, 28, 0.65);
      --surface-glass-border: rgba(255, 255, 255, 0.08);
      --surface-glass-hover: rgba(25, 28, 38, 0.85);

      --cyan-glow: #00f2fe;
      --cyan-bright: #4facfe;
      --violet-glow: #7928ca;
      --violet-bright: #b800ff;

      --text-main: #f1f3f9;
      --text-muted: #8e95aa;
      --text-dim: #545b70;

      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Geist", Helvetica, Arial, sans-serif;
      --transition-standard: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg-base);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      font-family: var(--font-family);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .ambient-aurora {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 800px;
      height: 800px;
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(121, 40, 202, 0.06) 45%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Brand & State */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: clamp(24px, 4vh, 48px);
    }

    .brand-container {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--surface-glass-border);
      border-radius: 9999px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    .brand-name {
      font-size: 13px;
      letter-spacing: 0.18em;
      font-weight: 700;
      text-transform: uppercase;
      color: #ffffff;
    }

    .divider {
      width: 1px;
      height: 12px;
      background: var(--surface-glass-border);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan-glow);
      box-shadow: 0 0 10px var(--cyan-glow);
      transition: var(--transition-standard);
    }

    /* Central Orb Stage */
    .orb-stage {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      min-height: 260px;
    }

    .orb-wrapper {
      position: relative;
      width: clamp(240px, 28vw, 420px);
      height: clamp(240px, 28vw, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .acoustic-wave {
      position: absolute;
      left: -24%;
      top: 50%;
      width: 148%;
      height: 94px;
      overflow: visible;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-50%) scaleX(.8) scaleY(.9);
      transform-origin: center;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, .55));
      transition: opacity .35s ease;
    }

    .acoustic-wave path {
      fill: none;
      stroke: var(--cyan-glow);
      stroke-width: 2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .wave-2 { width: 162%; height: 126px; left: -31%; opacity: 0; }
    .wave-2 path { stroke: #b800ff; stroke-width: 1.5; }
    .wave-3 { width: 176%; height: 154px; left: -38%; opacity: 0; }
    .wave-3 path { stroke: #64dffc; stroke-width: 1.2; }

    .orb {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.28) 0%, rgba(0, 242, 254, 0.22) 28%, rgba(121, 40, 202, 0.32) 65%, #08090d 95%);
      box-shadow: 
        inset 0 0 35px rgba(255, 255, 255, 0.2),
        inset 0 -12px 30px rgba(0, 0, 0, 0.8),
        0 12px 50px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(0, 242, 254, 0.18),
        0 0 120px rgba(121, 40, 202, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s ease, border-color 0.6s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .orb-nucleus {
      position: absolute;
      width: 44%;
      height: 44%;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 40%, #00f2fe 0%, #4facfe 35%, #7928ca 80%, #1a0833 100%);
      box-shadow: 
        0 0 40px rgba(0, 242, 254, 0.6),
        inset 0 0 20px rgba(255, 255, 255, 0.7);
      transition: var(--transition-standard);
    }

    .orb-caustic {
      position: absolute;
      top: -30%;
      left: -30%;
      width: 160%;
      height: 160%;
      border-radius: 40%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(0, 242, 254, 0.15) 30%, transparent 60%);
      filter: blur(8px);
      pointer-events: none;
    }

    .orbital-ring {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 1px dashed rgba(0, 242, 254, 0.35);
      pointer-events: none;
      transition: var(--transition-standard);
    }

    /* Orb States */
    body[data-state="ready"] .status-dot { background: var(--cyan-glow); box-shadow: 0 0 10px var(--cyan-glow); }
    body[data-state="ready"] .orb { animation: orbFloat 6s ease-in-out infinite; }
    body[data-state="ready"] .orb-nucleus { transform: scale(0.9); animation: nucleusBreathe 5s ease-in-out infinite alternate; }
    body[data-state="ready"] .orbital-ring { animation: spinSlow 36s linear infinite; }

    body[data-state="listening"] .status-dot { background: var(--cyan-bright); box-shadow: 0 0 14px var(--cyan-glow); animation: blinkPulse 1.2s infinite; }
    body[data-state="listening"] .orb {
      transform: scale(1.04);
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: inset 0 0 40px rgba(0, 242, 254, 0.3), 0 0 70px rgba(0, 242, 254, 0.4);
    }
    body[data-state="listening"] .orb-nucleus {
      transform: scale(1.12);
      background: radial-gradient(circle at 45% 40%, #ffffff 0%, #00f2fe 40%, #0072ff 90%);
      box-shadow: 0 0 55px rgba(0, 242, 254, 0.85);
      animation: listenPulse 1.6s ease-in-out infinite alternate;
    }
    body[data-state="listening"] .acoustic-wave {
      opacity: 0.76;
      animation: soundWaveMove 1.35s ease-in-out infinite;
    }
    body[data-state="listening"] .wave-2 { opacity: .42; animation-delay: .12s; }
    body[data-state="listening"] .wave-3 { opacity: .3; animation-delay: .24s; }
    body[data-state="listening"] .orbital-ring { border-color: rgba(0, 242, 254, 0.7); animation: spinFast 14s linear infinite; }

    body[data-state="thinking"] .status-dot { background: var(--violet-bright); box-shadow: 0 0 14px var(--violet-bright); animation: blinkPulse 0.9s infinite; }
    body[data-state="thinking"] .orb {
      transform: scale(0.97);
      border-color: rgba(184, 0, 255, 0.45);
      box-shadow: inset 0 0 45px rgba(121, 40, 202, 0.4), 0 0 80px rgba(121, 40, 202, 0.45);
    }
    body[data-state="thinking"] .orb-nucleus {
      background: radial-gradient(circle at 45% 40%, #ff80ff 0%, #b800ff 45%, #5200ff 100%);
      box-shadow: 0 0 60px rgba(184, 0, 255, 0.8);
      animation: thinkWarp 2.2s ease-in-out infinite;
    }
    body[data-state="thinking"] .orb-caustic { animation: spinFast 3.5s linear infinite; }
    body[data-state="thinking"] .orbital-ring { border-color: rgba(184, 0, 255, 0.6); animation: spinFastReverse 8s linear infinite; }

    body[data-state="speaking"] .status-dot { background: #00f2fe; box-shadow: 0 0 15px #00f2fe, 0 0 25px #b800ff; }
    body[data-state="speaking"] .orb {
      animation: speakOscillate 1.8s ease-in-out infinite alternate;
      border-color: rgba(0, 242, 254, 0.6);
      box-shadow: inset 0 0 45px rgba(255, 255, 255, 0.4), 0 0 90px rgba(0, 242, 254, 0.45), 0 0 160px rgba(121, 40, 202, 0.35);
    }
    body[data-state="speaking"] .orb-nucleus {
      animation: speakNucleus 0.85s ease-in-out infinite alternate;
      background: radial-gradient(circle at 45% 40%, #ffffff 0%, #00f2fe 35%, #b800ff 85%);
      box-shadow: 0 0 70px rgba(0, 242, 254, 0.9);
    }
    body[data-state="speaking"] .acoustic-wave {
      opacity: 0.84;
      animation: soundWaveMove .92s ease-in-out infinite;
    }
    body[data-state="speaking"] .wave-2 { opacity: .62; animation-delay: .1s; filter: drop-shadow(0 0 9px rgba(184, 0, 255, .6)); }
    body[data-state="speaking"] .wave-3 { opacity: .4; animation-delay: .2s; }
    body[data-state="speaking"] .orbital-ring { border-color: rgba(0, 242, 254, 0.75); animation: spinFast 10s linear infinite; }

    @keyframes orbFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes nucleusBreathe { 0% { transform: scale(0.88); opacity: 0.85; } 100% { transform: scale(1.02); opacity: 1; } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinFast { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinFastReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes blinkPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes listenPulse { 0% { transform: scale(1.05); } 100% { transform: scale(1.22); } }
    @keyframes thinkWarp {
      0% { transform: scale(0.92) rotate(0deg); border-radius: 50%; }
      50% { transform: scale(1.1) rotate(180deg); border-radius: 44% 56% 48% 52%; }
      100% { transform: scale(0.92) rotate(360deg); border-radius: 50%; }
    }
    @keyframes speakOscillate { 0% { transform: scale(1.0); } 50% { transform: scale(1.06); } 100% { transform: scale(1.02); } }
    @keyframes speakNucleus { 0% { transform: scale(0.98); } 100% { transform: scale(1.28); } }
    @keyframes soundWaveMove {
      0%, 100% { transform: translateY(-50%) scaleX(.78) scaleY(.78); }
      50% { transform: translateY(-50%) scaleX(1) scaleY(1.12); }
    }

    /* Transcripts & Dock */
    .interaction-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: clamp(620px, 64vw, 980px);
      padding: 0 clamp(16px, 3vw, 36px);
      padding-bottom: clamp(28px, 4.5vh, 52px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .transcript-card {
      background: var(--surface-glass);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--surface-glass-border);
      border-radius: 20px;
      padding: clamp(18px, 2.4vh, 26px) clamp(20px, 2.5vw, 32px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: var(--transition-standard);
    }

    .transcript-card:hover {
      border-color: rgba(255, 255, 255, 0.14);
      background: var(--surface-glass-hover);
    }

    .transcript-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .label-user { color: var(--text-muted); }
    .label-nova { color: var(--cyan-glow); }

    .transcript-text {
      font-size: clamp(15px, 1.25vw, 19px);
      line-height: 1.55;
      font-weight: 400;
      color: var(--text-main);
      min-height: 24px;
      word-break: break-word;
      max-height: 28vh;
      overflow-y: auto;
    }

    .transcript-text.empty {
      color: var(--text-dim);
      font-style: italic;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.15em;
      background: var(--cyan-glow);
      margin-left: 4px;
      vertical-align: -2px;
      border-radius: 2px;
      box-shadow: 0 0 8px var(--cyan-glow);
      animation: cursorBlink 0.8s infinite;
    }

    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .control-dock {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
    }

    .mic-button {
      position: relative;
      width: clamp(56px, 4.8vw, 68px);
      height: clamp(56px, 4.8vw, 68px);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: radial-gradient(circle at 35% 30%, #1e2230 0%, #12141c 100%);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: var(--transition-standard);
      outline: none;
    }

    .mic-button:hover {
      transform: scale(1.06);
      border-color: var(--cyan-glow);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), 0 10px 28px rgba(0, 0, 0, 0.6);
    }

    .mic-button svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    body[data-state="listening"] .mic-button {
      background: radial-gradient(circle at 35% 30%, #00f2fe 0%, #0072ff 100%);
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.7);
      color: #0c0d11;
      transform: scale(1.05);
    }

    /* Window buttons (hide / quit) in the docked strip */
    .win-controls {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    .win-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--surface-glass-border);
      background: var(--surface-glass);
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: var(--transition-standard);
    }
    .win-btn:hover { color: #fff; border-color: rgba(255, 255, 255, 0.3); }
    .win-btn.quit:hover { color: #ff8a8a; border-color: rgba(255, 90, 90, 0.6); }

    /* Slim docked mode: NOVA lives in a narrow strip at the screen edge */
    @media (max-width: 560px) {
      .ambient-aurora { width: 120vw; height: 60vh; filter: blur(60px); }
      header { padding-top: 16px; }
      .brand-container { padding: 6px 14px; gap: 10px; }
      .orb-stage { min-height: 0; }
      .orb-wrapper { width: clamp(170px, 62vw, 250px); height: clamp(170px, 62vw, 250px); }
      .acoustic-wave { left: -10%; width: 120%; }
      .wave-2 { left: -14%; width: 128%; }
      .wave-3 { left: -18%; width: 136%; }
      .interaction-container { max-width: 100%; padding: 0 14px 18px; gap: 10px; }
      .transcript-card { padding: 12px 16px; border-radius: 16px; gap: 6px; }
      .transcript-text { font-size: 14px; line-height: 1.5; max-height: 24vh; }
      .mic-button { width: 56px; height: 56px; }
    }

    /* Text mode: type to NOVA (no microphone, no pet). */
    .text-form { display: none; }
    body.textonly .text-form { display: flex; gap: 10px; align-items: flex-end; width: 100%; }
    body.textonly .mic-button, body.textonly .win-controls { display: none; }
    body.textonly .control-dock { width: 100%; margin-top: 0; }
    body.textonly .transcript-text { white-space: pre-wrap; max-height: 30vh; }
    body.textonly .orb-wrapper { width: clamp(120px, 18vh, 190px); height: clamp(120px, 18vh, 190px); }
    body.textonly .orb-stage { min-height: 0; }
    .text-input { flex: 1; resize: none; min-height: 48px; max-height: 140px; padding: 13px 18px;
      border-radius: 16px; border: 1px solid var(--surface-glass-border); background: var(--surface-glass);
      color: var(--text-main); font: inherit; font-size: 15px; line-height: 1.4; outline: none; }
    .text-input:focus { border-color: rgba(0, 242, 254, 0.5); }
    .text-input::placeholder { color: var(--text-dim); }
    .send-btn { height: 48px; padding: 0 22px; border-radius: 16px; border: 1px solid rgba(0, 242, 254, 0.45);
      background: linear-gradient(135deg, rgba(0, 242, 254, .25), rgba(121, 40, 202, .3)); color: var(--text-main);
      font: inherit; font-weight: 600; cursor: pointer; }
    .send-btn:hover { border-color: rgba(0, 242, 254, 0.8); }
    .send-btn.stop { border-color: rgba(255, 90, 90, 0.6); background: rgba(255, 90, 90, .18); }

    /* Pet mode: just a small floating orb. Drag it anywhere; click it to talk. */
    html.pet, html.pet body { background: transparent !important; background-image: none !important; overflow: hidden; }
    body.pet { padding: 0; }
    body.pet .ambient-aurora, body.pet .interaction-container, body.pet .brand-container,
    body.pet .acoustic-wave { display: none !important; }
    body.pet header { position: absolute; top: 0; left: 0; right: 0; padding: 4px; z-index: 20; }
    body.pet .win-controls { position: static; justify-content: flex-end; opacity: 0; transition: opacity .2s; }
    body.pet:hover .win-controls { opacity: 1; }
    body.pet .win-btn { width: 22px; height: 22px; font-size: 11px; }
    body.pet .orb-stage { min-height: 0; height: 100vh; }
    body.pet .orb-wrapper { width: 104px; height: 104px; }
    #expand-btn { display: none; }
    body.pet #collapse-btn { display: none; }
    body.pet #expand-btn { display: inline-block; }
    body.pet .pet-label { display: block; }
    .pet-label { display: none; position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
      font-size: 10px; letter-spacing: .08em; color: var(--text-muted); pointer-events: none; z-index: 20; }

    /* Saved conversations */
    body { justify-content: flex-start; }
    header { flex: 0 0 auto; }
    .orb-stage { flex: 0 1 30vh; min-height: 150px; }
    .chat-sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 30; width: 270px; padding: 74px 14px 18px;
      background: rgba(13, 15, 21, .97); border-right: 1px solid var(--surface-glass-border);
      box-shadow: 18px 0 50px rgba(0,0,0,.28); transform: translateX(-102%);
      transition: transform .25s ease; display: flex; flex-direction: column; gap: 12px;
    }
    body.history-open .chat-sidebar { transform: translateX(0); }
    .history-toggle {
      position: absolute; left: 14px; top: 12px; z-index: 31; width: 36px; height: 36px;
      border-radius: 10px; color: var(--text-muted); border: 1px solid var(--surface-glass-border);
      background: var(--surface-glass); cursor: pointer; font-size: 18px;
    }
    .history-toggle:hover, .new-chat-btn:hover { color: white; border-color: rgba(0,242,254,.45); }
    .sidebar-heading { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .new-chat-btn { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--surface-glass-border); color: var(--text-main); background: rgba(255,255,255,.04); cursor: pointer; text-align: left; }
    .chat-list { overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
    .chat-list button { width: 100%; text-align: left; padding: 10px 11px; color: var(--text-muted); background: transparent; border: 1px solid transparent; border-radius: 9px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-list button:hover { background: rgba(255,255,255,.055); color: var(--text-main); }
    .chat-list button.active { color: var(--text-main); background: rgba(0,242,254,.09); border-color: rgba(0,242,254,.18); }
    .conversation-feed { z-index: 6; flex: 1 1 auto; min-height: 90px; width: min(850px, 94vw); overflow-y: auto; padding: 4px 18px 14px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }
    .active-chat-title { color: var(--text-muted); text-align: center; font-size: 12px; margin: 0 0 4px; }
    .chat-message { max-width: 90%; padding: 13px 16px; border-radius: 17px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; font-size: 15px; }
    .chat-message.user { align-self: flex-end; background: rgba(49, 55, 68, .72); border: 1px solid rgba(255,255,255,.08); }
    .chat-message.assistant { align-self: flex-start; background: rgba(19, 22, 31, .78); border: 1px solid rgba(255,255,255,.07); }
    .chat-message .speaker { display: block; color: var(--cyan-glow); font-size: 10px; font-weight: 700; letter-spacing: .14em; margin-bottom: 5px; }
    .chat-message.user .speaker { color: var(--text-muted); }
    .chat-welcome { margin: auto; color: var(--text-muted); text-align: center; font-size: 14px; }
    .interaction-container { flex: 0 0 auto; padding-bottom: 18px; }
    .interaction-container .transcript-card { display: none; }
    body.pet .chat-sidebar, body.pet .history-toggle { display: none; }
    body.pet .conversation-feed { display: none; }
    body.pet .orb-stage { flex: 1; min-height: 0; }
    .chat-list button:disabled, .new-chat-btn:disabled { opacity: .5; cursor: default; }
    html.widget, html.widget body { background: transparent !important; background-image: none !important; overflow: hidden; }
    body.widget { display: block; padding: 0; }
    body.widget .ambient-aurora, body.widget header, body.widget .orb-stage, body.widget .conversation-feed,
    body.widget .interaction-container, body.widget .chat-sidebar, body.widget .history-toggle { display: none !important; }
    .widget-bar {
      position: absolute; inset: 0; display: none; align-items: center; gap: 13px; padding: 11px 14px;
      border: 1px solid rgba(255,255,255,.14); border-radius: 19px;
      background: linear-gradient(135deg, rgba(23,27,39,.97), rgba(13,16,25,.97));
      box-shadow: 0 12px 42px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    }
    body.widget .widget-bar { display: flex; }
    body.fullchat .text-form { display: flex; gap: 10px; align-items: flex-end; width: 100%; }
    body.fullchat .control-dock { width: 100%; }
    .widget-orb { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      background: radial-gradient(circle at 35% 30%, #fff, #00e5ff 28%, #6b50d8 70%, #171528);
      box-shadow: 0 0 22px rgba(0,229,255,.44), inset 0 0 10px rgba(255,255,255,.65); }
    body[data-state="listening"] .widget-orb { animation: listenPulse 1s ease-in-out infinite alternate; }
    body[data-state="thinking"] .widget-orb { background: radial-gradient(circle, #ff91ff, #8d36e6 65%, #171528); }
    .widget-transcripts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .widget-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 13px; line-height: 1.35; }
    .widget-line strong { flex: 0 0 42px; font-size: 9px; letter-spacing: .12em; color: var(--text-muted); }
    .widget-line.reply strong { color: var(--cyan-glow); }
    .widget-line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); }
    .widget-line.caption span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; white-space: normal; font-weight: 600; }
    body[data-state="listening"] .widget-line.caption span { color: var(--cyan-glow); }
    .widget-actions { display: flex; align-items: center; gap: 7px; }
    .widget-action { width: 34px; height: 34px; border-radius: 11px; border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06); color: var(--text-main); cursor: pointer; font-size: 16px; }
    .widget-action:hover { border-color: rgba(0,242,254,.55); background: rgba(0,242,254,.12); }
    .widget-action.extra { opacity: 0; transform: translateX(5px); pointer-events: none; transition: opacity .16s ease, transform .16s ease; }
    .widget-bar:hover .widget-action.extra, .widget-bar:focus-within .widget-action.extra { opacity: 1; transform: translateX(0); pointer-events: auto; }
    body[data-state="listening"] .widget-action.extra, body[data-state="thinking"] .widget-action.extra,
    body[data-state="speaking"] .widget-action.extra { opacity: 1; transform: translateX(0); pointer-events: auto; }
    body[data-state="listening"] #widget-mic { color: #091016; background: var(--cyan-glow); }
    @media (max-width: 480px) { .widget-bar { gap: 8px; padding: 8px; } .widget-line { font-size: 11px; } .widget-line strong { flex-basis: 34px; } .widget-action { width: 30px; height: 30px; } }
    @media (max-width: 620px) {
      .chat-sidebar { width: min(82vw, 290px); }
      .conversation-feed { width: 100%; padding-inline: 12px; }
      .chat-message { max-width: 96%; }
      .orb-stage { flex-basis: 23vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-height: 800px) {
      header { padding-top: 18px; }
      .orb-stage { min-height: 200px; }
      .interaction-container { padding-bottom: 22px; gap: 12px; }
      .transcript-card { padding: 14px 22px; gap: 6px; }
      .transcript-text { font-size: 15px; }
    }
  </style>
</head>
<body data-state="ready">
  <div class="pet-label" id="pet-label"></div>

  <div class="ambient-aurora"></div>

  <button class="history-toggle" id="history-toggle" aria-label="Open chat history" title="Chat history">☰</button>
  <aside class="chat-sidebar" id="chat-sidebar" aria-label="Saved chats">
    <div class="sidebar-heading"><span>Chats</span><button class="new-chat-btn" id="new-chat-btn" type="button">＋ New chat</button></div>
    <nav class="chat-list" id="chat-list"></nav>
  </aside>
  <div class="widget-bar" id="widget-bar" aria-label="NOVA mini widget">
    <div class="widget-orb" id="widget-orb" title="Start listening or expand NOVA"></div>
    <div class="widget-transcripts" aria-live="polite">
      <div class="widget-line caption"><strong>YOU</strong><span id="widget-user">Click the mic and speak</span></div>
      <div class="widget-line reply"><strong>NOVA</strong><span id="widget-reply">Ready when you are</span></div>
    </div>
    <div class="widget-actions">
      <button class="widget-action" id="widget-mic" type="button" aria-label="Start listening" title="Dictate — click to speak">&#127908;</button>
      <button class="widget-action extra" id="widget-expand" type="button" aria-label="Maximize NOVA" title="Expand NOVA">&#8599;</button>
      <button class="widget-action extra" id="widget-quit" type="button" aria-label="Quit NOVA" title="Quit NOVA">&#215;</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="win-controls">
      <button class="win-btn" id="expand-btn" title="Open the chat" aria-label="Open the chat">&#10530;</button>
      <button class="win-btn" id="collapse-btn" title="Shrink to the small orb" aria-label="Shrink to the small orb">&#10529;</button>
      <button class="win-btn" id="hide-btn" title="Hide (Ctrl+Alt+H)" aria-label="Hide NOVA">&#8211;</button>
      <button class="win-btn quit" id="quit-btn" title="Quit NOVA (Ctrl+Alt+Q)" aria-label="Quit NOVA">&#10005;</button>
    </div>
    <div class="brand-container">
      <span class="brand-name">NOVA</span>
      <span class="divider"></span>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="state-text">Ready</span>
      </div>
    </div>
  </header>

  <!-- Animated Orb -->
  <main class="orb-stage">
    <div class="orb-wrapper" id="orb-interactive" title="Click the orb to speak">
      <svg class="acoustic-wave wave-1" viewBox="0 0 1200 180" aria-hidden="true" preserveAspectRatio="none"><path d="M0 90 H80 C120 90 120 28 160 28 S200 152 240 152 S280 46 320 46 S360 134 400 134 S440 20 480 20 S520 160 560 160 S600 58 640 58 S680 122 720 122 S760 34 800 34 S840 146 880 146 S920 90 960 90 H1200"/></svg>
      <svg class="acoustic-wave wave-2" viewBox="0 0 1200 180" aria-hidden="true" preserveAspectRatio="none"><path d="M0 90 H100 C140 90 140 52 180 52 S220 128 260 128 S300 18 340 18 S380 162 420 162 S460 62 500 62 S540 118 580 118 S620 38 660 38 S700 142 740 142 S780 54 820 54 S860 126 900 126 S940 90 980 90 H1200"/></svg>
      <svg class="acoustic-wave wave-3" viewBox="0 0 1200 180" aria-hidden="true" preserveAspectRatio="none"><path d="M0 90 H70 C110 90 110 40 150 40 S190 140 230 140 S270 64 310 64 S350 116 390 116 S430 30 470 30 S510 150 550 150 S590 48 630 48 S670 132 710 132 S750 22 790 22 S830 158 870 158 S910 90 950 90 H1200"/></svg>
      <div class="orbital-ring"></div>
      <div class="orb">
        <div class="orb-caustic"></div>
        <div class="orb-nucleus"></div>
      </div>
    </div>
  </main>

  <section class="conversation-feed" id="conversation-feed" aria-live="polite">
    <div class="active-chat-title" id="active-chat-title"></div>
    <div class="chat-welcome" id="chat-welcome">Start a new chat, or choose one from your history.</div>
  </section>

  <!-- Transcripts & Mic -->
  <section class="interaction-container">
    <div class="transcript-card" id="user-card">
      <div class="transcript-label label-user">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        You
      </div>
      <p class="transcript-text empty" id="user-transcript">Click the orb and say something.</p>
    </div>

    <div class="transcript-card" id="nova-card">
      <div class="transcript-label label-nova">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        NOVA
      </div>
      <p class="transcript-text empty" id="nova-transcript"><span id="nova-reply-content">NOVA is ready when you are.</span><span class="typing-cursor" id="typing-cursor" style="display: none;"></span></p>
    </div>

    <div class="control-dock">
      <form class="text-form" id="text-form" autocomplete="off">
        <textarea class="text-input" id="text-input" rows="1" placeholder="Type to NOVA... (Enter to send, Shift+Enter for a new line)"></textarea>
        <button class="send-btn" id="send-btn" type="submit">Send</button>
      </form>
      <button class="mic-button" id="mic-toggle" aria-label="Start voice input" title="Start listening">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- Host API Script -->
  <script>
    (function () {
      const VALID_STATES = ['ready', 'listening', 'thinking', 'speaking'];
      const STATE_LABELS = {
        ready: 'Ready',
        listening: 'Listening',
        thinking: 'Thinking',
        speaking: 'Speaking'
      };

      const bodyEl = document.body;
      const stateTextEl = document.getElementById('state-text');
      const userTranscriptEl = document.getElementById('user-transcript');
      const novaTranscriptEl = document.getElementById('nova-transcript');
      let novaReplyContentEl = document.getElementById('nova-reply-content');
      const micBtn = document.getElementById('mic-toggle');
      const orbInteractive = document.getElementById('orb-interactive');
      const chatFeed = document.getElementById('conversation-feed');
      const chatList = document.getElementById('chat-list');
      const chatTitle = document.getElementById('active-chat-title');
      let activeAssistantMessage = null;

      function addMessage(role, text) {
        const welcome = document.getElementById('chat-welcome');
        if (welcome) welcome.remove();
        const bubble = document.createElement('article');
        bubble.className = `chat-message ${role}`;
        const label = document.createElement('span');
        label.className = 'speaker';
        label.textContent = role === 'user' ? 'YOU' : 'NOVA';
        const content = document.createElement('span');
        content.className = 'message-content';
        content.textContent = String(text || '');
        bubble.append(label, content);
        chatFeed.appendChild(bubble);
        chatFeed.scrollTop = chatFeed.scrollHeight;
        return content;
      }

      function renderMessages(messages) {
        chatFeed.querySelectorAll('.chat-message, .chat-welcome').forEach((node) => node.remove());
        activeAssistantMessage = null;
        if (!messages || !messages.length) {
          const welcome = document.createElement('div');
          welcome.className = 'chat-welcome';
          welcome.id = 'chat-welcome';
          welcome.textContent = 'Start a new chat, or choose one from your history.';
          chatFeed.appendChild(welcome);
          return;
        }
        messages.forEach((message) => addMessage(message.role, message.content));
        chatFeed.scrollTop = chatFeed.scrollHeight;
      }

      window.setChatList = function (sessions, activeId) {
        chatList.replaceChildren();
        const active = (sessions || []).find((item) => item.id === activeId);
        chatTitle.textContent = active && active.title !== 'New chat' ? active.title : '';
        (sessions || []).forEach((session) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = session.title || 'New chat';
          button.title = button.textContent;
          button.classList.toggle('active', session.id === activeId);
          button.disabled = bodyEl.getAttribute('data-state') === 'thinking' || bodyEl.getAttribute('data-state') === 'speaking';
          button.addEventListener('click', async () => {
            if (!window.pywebview || !window.pywebview.api) return;
            const result = await window.pywebview.api.switch_chat(session.id);
            if (result && result.ok) window.loadChatState(result);
            else if (result && result.message) window.setNovaReply(result.message);
          });
          chatList.appendChild(button);
        });
      };

      window.loadChatState = function (state) {
        if (!state) return;
        window.setChatList(state.sessions, state.active_id);
        const active = (state.sessions || []).find((item) => item.id === state.active_id);
        chatTitle.textContent = active && active.title !== 'New chat' ? active.title : '';
        renderMessages(state.messages || []);
        const previousUser = [...(state.messages || [])].reverse().find((item) => item.role === 'user');
        const previousReply = [...(state.messages || [])].reverse().find((item) => item.role === 'assistant');
        document.getElementById('widget-user').textContent = previousUser ? previousUser.content : 'Click the mic and speak';
        document.getElementById('widget-reply').textContent = previousReply ? previousReply.content : 'Ready when you are';
      };

      /**
       * External API: Set Voice State
       * @param {'ready'|'listening'|'thinking'|'speaking'} state
       */
      window.setState = function (state) {
        if (!state) return;
        const normalized = state.toLowerCase().trim();
        if (!VALID_STATES.includes(normalized)) {
          console.warn(`[NOVA] Invalid state: "${state}". Allowed: ${VALID_STATES.join(', ')}`);
          return;
        }
        bodyEl.setAttribute('data-state', normalized);
        const sendBtn = document.getElementById('send-btn');
        const busy = normalized === 'thinking' || normalized === 'speaking';
        sendBtn.textContent = busy ? 'Stop' : 'Send';
        sendBtn.classList.toggle('stop', busy);
        document.getElementById('new-chat-btn').disabled = busy || normalized === 'listening';
        chatList.querySelectorAll('button').forEach((button) => { button.disabled = busy || normalized === 'listening'; });
        const petLabel = document.getElementById('pet-label');
        if (petLabel) petLabel.textContent = normalized === 'ready' ? '' : STATE_LABELS[normalized];
        stateTextEl.textContent = STATE_LABELS[normalized];
        const widgetUser = document.getElementById('widget-user');
        const widgetReply = document.getElementById('widget-reply');
        if (normalized === 'listening' && (!widgetUser.textContent || widgetUser.textContent === 'Click the mic and speak')) widgetUser.textContent = 'Listening…';
        if (normalized === 'thinking' && (!widgetReply.textContent || widgetReply.textContent === 'Ready when you are')) widgetReply.textContent = 'Thinking…';
        if (normalized === 'ready') {
          document.getElementById('typing-cursor').style.display = 'none';
        }
      };

      /**
       * External API: Set User Transcript
       * @param {string} text
       */
      window.setUserTranscript = function (text) {
        const value = String(text || '').trim();
        if (!value) {
          userTranscriptEl.textContent = 'Listening for speech…';
          userTranscriptEl.classList.add('empty');
          document.getElementById('widget-user').textContent = 'Listening…';
        } else {
          userTranscriptEl.classList.remove('empty');
          userTranscriptEl.textContent = value;
          document.getElementById('widget-user').textContent = value;
          if (!/^(getting the microphone ready|listening for speech)\.\.\.$/i.test(value)) {
            addMessage('user', value);
            activeAssistantMessage = null;
          }
        }
      };

      /**
       * External API: Set or Stream NOVA Reply
       * @param {string} text
       * @param {boolean} progressive
       * @param {number} speedMs
       */
      window.setNovaReply = function (text) {
        const value = String(text || '');
        novaReplyContentEl.textContent = value || 'NOVA is ready when you are.';
        novaTranscriptEl.classList.toggle('empty', !value);
        document.getElementById('typing-cursor').style.display = 'none';
        document.getElementById('widget-reply').textContent = value || (bodyEl.getAttribute('data-state') === 'listening' ? 'Listening…' : 'Ready when you are');
        if (value) {
          if (!activeAssistantMessage) activeAssistantMessage = addMessage('assistant', value);
          else activeAssistantMessage.textContent = value;
          chatFeed.scrollTop = chatFeed.scrollHeight;
        }
      };

      window.beginNovaReply = function () {
        novaReplyContentEl.textContent = '';
        novaTranscriptEl.classList.remove('empty');
        document.getElementById('typing-cursor').style.display = 'inline-block';
        if (activeAssistantMessage && activeAssistantMessage.parentElement) activeAssistantMessage.parentElement.remove();
        activeAssistantMessage = addMessage('assistant', '');
        document.getElementById('widget-reply').textContent = 'Thinking…';
      };

      /**
       * External API: Append streaming chunk (WebSocket/SSE)
       * @param {string} chunk
       */
      window.appendNovaChunk = function (chunk) {
        novaTranscriptEl.classList.remove('empty');
        novaReplyContentEl.textContent += String(chunk || '');
        novaTranscriptEl.scrollTop = novaTranscriptEl.scrollHeight;
        if (!activeAssistantMessage) activeAssistantMessage = addMessage('assistant', '');
        activeAssistantMessage.textContent += String(chunk || '');
        document.getElementById('widget-reply').textContent += String(chunk || '');
        chatFeed.scrollTop = chatFeed.scrollHeight;
      };

      function startListening() {
        if (!window.pywebview || !window.pywebview.api) {
          window.setNovaReply('NOVA’s Python bridge is not connected. Start NOVA using nova.py.');
          return;
        }
        const state = bodyEl.getAttribute('data-state');
        if (bodyEl.classList.contains('textonly') && state !== 'thinking' && state !== 'speaking') {
          document.getElementById('text-input').focus();   // text mode: the orb just focuses the box
          return;
        }
        if (state === 'thinking' || state === 'speaking') {
          window.pywebview.api.stop();   // clicking the orb or mic while NOVA is busy = stop
          return;
        }
        window.pywebview.api.listen().then((result) => {
          if (result && !result.ok) window.setNovaReply(result.message || 'NOVA is busy. Try again shortly.');
        }).catch(() => window.setNovaReply('Could not start the microphone. Check its permissions.'));
      }

      micBtn.addEventListener('click', startListening);
      orbInteractive.addEventListener('click', startListening);

      function windowCall(name) {
        if (window.pywebview && window.pywebview.api && window.pywebview.api[name]) window.pywebview.api[name]();
      }
      document.getElementById('hide-btn').addEventListener('click', () => windowCall('hide_window'));
      document.getElementById('quit-btn').addEventListener('click', () => windowCall('quit_app'));
      document.getElementById('history-toggle').addEventListener('click', () => document.body.classList.toggle('history-open'));
      document.getElementById('widget-mic').addEventListener('click', startListening);
      document.getElementById('widget-orb').addEventListener('click', () => windowCall('expand'));
      document.getElementById('widget-expand').addEventListener('click', () => windowCall('expand'));
      document.getElementById('widget-quit').addEventListener('click', () => windowCall('quit_app'));
      document.getElementById('new-chat-btn').addEventListener('click', async () => {
        if (!window.pywebview || !window.pywebview.api) return;
        const result = await window.pywebview.api.new_chat();
        if (result && result.ok) {
          window.loadChatState(result);
          document.body.classList.remove('history-open');
          document.getElementById('text-input').focus();
        } else if (result && result.message) window.setNovaReply(result.message);
      });

      // Pet mode (small floating orb) <-> full panel. Python tells the page which one is on.
      window.setMode = function (mode) {
        const pet = mode === 'pet';
        const widget = mode === 'widget';
        document.documentElement.classList.toggle('pet', pet);
        bodyEl.classList.toggle('pet', pet);
        document.documentElement.classList.toggle('widget', widget);
        bodyEl.classList.toggle('widget', widget);
        bodyEl.classList.toggle('fullchat', mode === 'full');
        bodyEl.classList.toggle('textonly', mode === 'text');
        if (mode === 'text' || mode === 'full') document.getElementById('text-input').focus();
      };
      document.getElementById('collapse-btn').addEventListener('click', () => windowCall('collapse'));
      document.getElementById('expand-btn').addEventListener('click', (e) => { e.stopPropagation(); windowCall('expand'); });
      orbInteractive.addEventListener('dblclick', () => windowCall('expand'));
      // Clicking the orb also collapses the panel when the user taps the brand name
      document.querySelector('.brand-name').addEventListener('click', () => windowCall('collapse'));
      window.setMode('text');

      const textForm = document.getElementById('text-form');
      const textInput = document.getElementById('text-input');
      function growInput() { textInput.style.height = 'auto'; textInput.style.height = Math.min(textInput.scrollHeight, 140) + 'px'; }
      textInput.addEventListener('input', growInput);
      textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textForm.requestSubmit(); }
      });
      textForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const state = bodyEl.getAttribute('data-state');
        if (state === 'thinking' || state === 'speaking') { windowCall('stop'); return; }
        const value = textInput.value.trim();
        if (!value) return;
        if (!window.pywebview || !window.pywebview.api) { window.setNovaReply('NOVA’s Python bridge is not connected. Start NOVA using nova.py.'); return; }
        textInput.value = ''; growInput();
        window.pywebview.api.send_text(value).then((r) => {
          if (r && !r.ok) { window.setNovaReply(r.message || 'NOVA is busy. Try again shortly.'); textInput.value = value; }
        }).catch(() => window.setNovaReply('Could not send your message.'));
      });

      // Expose globally for pywebview / QWebChannel / CEF integration
      window.nova = {
        setState: window.setState,
        setUserTranscript: window.setUserTranscript,
        setNovaReply: window.setNovaReply,
        beginNovaReply: window.beginNovaReply,
        appendNovaChunk: window.appendNovaChunk,
        setChatList: window.setChatList,
        loadChatState: window.loadChatState,
        setMode: window.setMode
      };
    })();
  </script>
</body>
</html>
